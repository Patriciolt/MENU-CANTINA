<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TV Promos - Cantina ADPUT</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="logo-area">
    <img src="img/logo.png" class="logo-mini">
    <div>
      <h1>CANTINA ADPUT</h1>
      <span>PROMOS EN VIVO</span>
    </div>
  </div>

  <div class="info-right">
    <div id="fecha"></div>
    <div id="clima"></div>
    <div id="hora"></div>
  </div>
</header>

<main class="card">
  <div class="left">
    <div class="promo-badge">🔥 PROMO</div>
    <img id="imagenProducto" class="producto-img">
  </div>

  <div class="right">
    <h2 id="tituloProducto"></h2>
    <div id="precioProducto" class="precio"></div>
    <div id="descripcionProducto" class="tv-descripcion"></div>
  </div>
</main>

<script src="tv.js"></script>
</body>
</html>
